name: Validate package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified upstream commit
        with:
          persist-credentials: false
      - name: Test with Windows PowerShell
        shell: powershell
        run: .\tests\Test-Package.ps1
      - name: Test with PowerShell 7
        shell: pwsh
        run: .\tests\Test-Package.ps1
